# Alembic configuration for the NER Logistics API.
#
# The database URL is deliberately absent: it is assembled in env.py from the
# same Settings object the application uses, so a migration can never run
# against a different database than the API. Nothing here contains a credential.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Revisions are named 0001_initial_schema, 0002_..., so `ls versions/` reads in
# apply order. Alembic's own hash-based names sort meaninglessly.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migrations are UTC; see utcnow() in app/db/base.py.
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
